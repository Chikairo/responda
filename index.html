<!doctype html>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E12D39'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23FFFFFF' fill-opacity='0.24'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23FFFFFF'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>RESPONDA — Emergency Operations &amp; Command Dispatch</title>
    <meta
      name="description"
      content="AI-assisted emergency intake, location intelligence and command dispatch coordination for private emergency-response organisations in Lagos, Nigeria."
    />
